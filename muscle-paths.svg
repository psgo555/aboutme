<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800">
  <!--
    ============================================
    互動式人體肌群地圖 - SVG Path 資料
    正面 (Front) 中心 X=220, 背面 (Back) 中心 X=680
    viewBox: 0 0 900 800

    大肌群分區，點擊後才展開細分部位
    所有 path 均以 data-muscle 標記肌群 ID
    data-side="front" / "back" 標記正反面
    ============================================
  -->

  <style>
    .body-outline { fill: #1a2530; stroke: #3a4a5a; stroke-width: 1.2; }
    .muscle { stroke: #5a7a8a; stroke-width: 0.8; cursor: pointer; }
    .muscle.front { fill: #2e4a5e; }
    .muscle.back { fill: #2e4a5e; }
    .label { font-family: sans-serif; font-size: 9px; fill: #aaa; text-anchor: middle; pointer-events: none; }
    .side-title { font-family: sans-serif; font-size: 18px; fill: #ff6b35; text-anchor: middle; font-weight: bold; }
  </style>

  <!-- ==================== -->
  <!--    正面 FRONT VIEW    -->
  <!-- ==================== -->
  <text class="side-title" x="220" y="28">正面 FRONT</text>

  <!-- Front: Head -->
  <ellipse class="body-outline" cx="220" cy="68" rx="30" ry="36"/>
  <!-- Front: Neck -->
  <rect class="body-outline" x="208" y="100" width="24" height="18" rx="4"/>

  <!-- ========== 正面: 斜方肌 Traps (前面可見部分) ========== -->
  <path class="muscle front" data-muscle="traps" data-side="front" id="front-traps-L"
